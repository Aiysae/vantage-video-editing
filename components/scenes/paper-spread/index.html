<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <title>H 纸艺场景</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="kit.css" /><link rel="stylesheet" href="fonts.css" />
  <style>
    body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    #livewrap { position: absolute; inset: 0; z-index: 1; }
    #paper { position: absolute; inset: 0; z-index: 2; overflow: hidden; background: #0f141d; }
    #personwrap { position: absolute; inset: 0; z-index: 4; transform-origin: 50% 100%;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); mask-image: linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%); }
    #fg { z-index: 5; } #l5 { z-index: 7; }
    .sheet { position: absolute; inset: 0; }
    .sheet svg { position: absolute; inset: 0; filter: drop-shadow(0 14px 22px rgba(0,0,0,.5)); }
    .grain { position: absolute; inset: 0; background: url(grain.png); background-size: 512px; mix-blend-mode: soft-light; opacity: .22; pointer-events: none; }
    .card { position: absolute; width: 280px; height: 350px; margin: -175px 0 0 -140px; border-radius: 10px; background: #efe6d6;
      box-shadow: 0 16px 28px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.05); transform-origin: 50% 100%; }
    .card .tab { position: absolute; left: 22px; top: -14px; width: 74px; height: 28px; border-radius: 6px 6px 0 0; background: #66d4f2; }
    .card .ic { position: absolute; left: 24px; top: 30px; width: 64px; height: 64px; color: #18202d; }
    .card .ln { position: absolute; left: 24px; height: 12px; border-radius: 6px; background: #d4c8b4; }
    .ribbon { position: absolute; height: 10px; margin-top: -5px; background: #efe6d6; border-radius: 5px; transform-origin: 0 50%; box-shadow: 0 6px 12px rgba(0,0,0,.4); }
    .tile { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 12px; background: #222c3d; box-shadow: 0 8px 14px rgba(0,0,0,.45); }
    .tile i { position: absolute; left: 19px; top: 19px; width: 36px; height: 36px; border-radius: 50%; border: 4px solid #efe6d6; box-sizing: border-box; }
    .tile b { position: absolute; left: 31px; top: 31px; width: 12px; height: 12px; border-radius: 50%; background: #4a5568; }
    .mini { position: absolute; width: 22px; height: 27px; margin: -13px 0 0 -11px; border-radius: 4px; background: #efe6d6; box-shadow: 0 4px 8px rgba(0,0,0,.4); }
    .mini::before { content: ""; position: absolute; left: 4px; top: -4px; width: 10px; height: 5px; border-radius: 2px 2px 0 0; background: #66d4f2; }
    .head { position: absolute; left: 64px; top: 150px; width: 960px; height: 186px; overflow: hidden; }
    .hw { position: absolute; left: 0; top: 0; white-space: nowrap; }
    .hw .cn { font: 900 132px var(--f-display); color: #efe6d6; line-height: 1.05; letter-spacing: -.01em; }
    .hw .en { margin-top: 10px; font: 700 24px var(--f-ui); color: #66d4f2; letter-spacing: .22em; }
  </style>
</head>
<body>
  <div id="root" class="mu-v" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="7">
    <div id="livewrap"><video id="l0" class="full clip" src="assets/source.mp4" data-start="0" data-duration="7" data-media-start="22.9" data-track-index="0" muted playsinline></video></div>
    <audio id="vo" src="assets/source.mp4" data-start="0" data-duration="7" data-media-start="22.9" data-track-index="10" data-volume="1"></audio>
    <div id="paper"></div>
    <div id="personwrap"><video id="l3" class="full clip" src="assets/person.webm" data-start="0" data-duration="7" data-media-start="22.9" data-track-index="1" muted playsinline></video></div>
    <div id="fg" class="mu-stage"></div>
    <div id="l5" class="mu-stage"></div>
  </div>
  <script src="icons/icons.js"></script><script src="kit.js"></script>
  <script>
    function addSubs(tl, host) {
      [[0.15, 1.56, "这样，你会做的一件事", "So, one thing you're good at"], [1.65, 3.25, "就有机会传播出去", "gets a chance to spread,"], [3.65, 5.35, "被更多人的 AI", "and more people's AI"], [5.35, 7.0, "拿去用", "can put it to use."]]
        .forEach(([a, b, cn, en]) => { const s = MU.subtitle(host, { cn, en, top: 1400 }); tl.set(s, { autoAlpha: 0 }, 0); tl.set(s, { autoAlpha: 1 }, a); tl.set(s, { autoAlpha: 0 }, b); });
    }
  </script>
  <script>
    // 按《剪辑脚本.md》实现：层叠剪纸风格，唯一强调色青色；禁用发光/粒子/弹跳/交叉淡化
    const tl = gsap.timeline({ paused: true }), $ = (id) => document.getElementById(id);
    let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const NS = "http://www.w3.org/2000/svg", CX = 540, CY = 820, HEAD = "50% 36%";
    const paper = $("paper"), fg = $("fg"), pw = $("personwrap");
    // ---------- 纸层：手裁边缘的同心纸片，越靠中心越浅，形成纵深 ----------
    function blob(r, n, jit, cx, cy) { let d = ""; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, rr = r * (1 + (rnd() - .5) * jit);
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 1.25; d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " "; } return d + "Z"; }
    const layers = [[1500, "#141a25"], [1080, "#18202d"], [760, "#1d2635"], [480, "#222c3d"]].map(([r, c], k) => {
      const s = document.createElement("div"); s.className = "sheet"; paper.appendChild(s);
      s.innerHTML = `<svg viewBox="0 0 1080 1920" width="1080" height="1920"><path d="${blob(r, 90, .035, CX, CY)}" fill="${c}"/></svg>`;
      s.style.transformOrigin = `${CX}px ${CY}px`; return s; });
    const gr = document.createElement("div"); gr.className = "grain"; paper.appendChild(gr);
    // 揭示：纸层依次从头部位置“剪开”
    tl.fromTo(paper, { clipPath: `circle(0% at ${HEAD})` }, { clipPath: `circle(140% at ${HEAD})`, duration: 0.8, ease: "power3.inOut" }, 0.05);
    layers.forEach((l, k) => tl.fromTo(l, { scale: 0.6 + k * 0.05, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.1 + k * 0.08));
    tl.fromTo(pw, { filter: "drop-shadow(0 0 0 rgba(239,230,214,0))" }, { filter: "drop-shadow(0 0 18px rgba(239,230,214,.35))", duration: 0.5 }, 0.3);
    tl.to(pw, { scale: 0.5, x: -280, y: 420, duration: 0.75, ease: "power3.inOut" }, 0.25);
    // 视差后退（两次），越外层动得越少
    layers.forEach((l, k) => { tl.to(l, { scale: 1 - 0.06 * (k + 1), duration: 1.4, ease: "power2.inOut" }, 1.75); tl.to(l, { scale: 1 - 0.1 * (k + 1), duration: 1.3, ease: "power2.inOut" }, 3.7); });
    // ---------- 大字（遮罩上推切换） ----------
    const head = MU.el("div", "head", fg);
    const words = [["一件事", "ONE THING", 0.35], ["传播出去", "SPREAD OUT", 1.7], ["更多人的 AI", "MORE PEOPLE'S AI", 3.7], ["拿去用", "PUT TO USE", 5.4]];
    words.forEach(([cn, en, t], i) => { const w = MU.el("div", "hw", head, `<div class="cn" data-layout-allow-overflow data-layout-allow-overlap>${cn}</div><div class="en" data-layout-allow-overflow data-layout-allow-overlap>${en}</div>`);
      tl.fromTo(w, { yPercent: 130 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, t);
      if (i < words.length - 1) tl.to(w, { yPercent: -130, duration: 0.35, ease: "power3.in" }, words[i + 1][2] - 0.05); });
    // ---------- 纸卡（你的一件事）：从平折翻开 ----------
    const stage = MU.el("div", null, fg, null, { position: "absolute", inset: "0", perspective: "1400px" });
    function card(parent, x, y) { const c = MU.el("div", "card", parent, `<div class="tab"></div><div class="ic">${window.MU_ICONS.lucide.package}</div>` +
      [130, 172, 214, 256, 298].map((t, i) => `<div class="ln" style="top:${t}px;width:${[200, 230, 170, 220, 140][i]}px"></div>`).join(""), { left: x + "px", top: y + "px" });
      c.querySelector("svg").setAttribute("stroke-width", "1.8"); return c; }
    const main = card(stage, CX, CY);
    tl.fromTo(main, { rotationX: -88, autoAlpha: 0 }, { rotationX: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.8);
    // ---------- 传播：纸带展开 + 副本沿带滑出，再一分为二 ----------
    const L1 = [[-150, 330], [-30, 330], [90, 300]], copies = [], ribbons = [];
    L1.forEach(([deg, len], i) => {
      const a = deg * Math.PI / 180, ex = CX + Math.cos(a) * len, ey = CY + Math.sin(a) * len;
      const rb = MU.el("div", "ribbon", fg, null, { left: CX + "px", top: CY + "px", width: len + "px", transform: `rotate(${deg}deg)` }); fg.insertBefore(rb, stage); ribbons.push(rb);
      tl.fromTo(rb, { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 1.75 + i * 0.1);
      const cp = card(stage, CX, CY); cp.o = [CX, CY]; copies.push(cp);
      tl.fromTo(cp, { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 0.46, x: ex - CX, y: ey - CY, duration: 0.7, ease: "power3.inOut" }, 1.85 + i * 0.1);
      [-38, 38].forEach((d2, j) => { const b = (deg + d2) * Math.PI / 180, fx = ex + Math.cos(b) * 190, fy = ey + Math.sin(b) * 190;
        const rb2 = MU.el("div", "ribbon", fg, null, { left: ex + "px", top: ey + "px", width: "190px", height: "7px", transform: `rotate(${deg + d2}deg)` }); fg.insertBefore(rb2, stage); ribbons.push(rb2);
        tl.fromTo(rb2, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.45 + i * 0.08 + j * 0.05);
        const c2 = card(stage, ex, ey); c2.o = [ex, ey]; copies.push(c2);
        tl.fromTo(c2, { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 0.3, x: fx - ex, y: fy - ey, duration: 0.6, ease: "power3.inOut" }, 2.5 + i * 0.08 + j * 0.05); });
    });
    tl.to(main, { scale: 0.62, duration: 1.4, ease: "power2.inOut" }, 1.75);
    // ---------- 更多人的 AI：网格按距离波纹翻出；副本与纸带收回 ----------
    ribbons.forEach((rb, i) => tl.to(rb, { scaleX: 0, autoAlpha: 0, duration: 0.45, ease: "power3.in" }, 3.5 + i * 0.01));
    copies.forEach((cp, i) => tl.to(cp, { x: CX - cp.o[0], y: CY - cp.o[1], scale: 0.2, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 3.55 + i * 0.01));
    tl.to(main, { scale: 0.38, duration: 0.6, ease: "power3.inOut" }, 3.6);
    const tiles = [], COLS = 10, ROWS = 10, SX = 96, SY = 96;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = CX + (c - (COLS - 1) / 2) * SX, y = CY + (r - (ROWS - 1) / 2) * SY + 20;
      const d = Math.hypot(x - CX, y - CY); if (d < 150) continue;                        // 给中心卡片留位
      if (y > 1300 || (x < 360 && y > 1180)) continue;                                   // 避开字幕区与左下人物
      const t = MU.el("div", "tile", fg, "<i></i><b></b>", { left: x + "px", top: y + "px" }); fg.insertBefore(t, stage);
      tiles.push({ el: t, x, y, d });
    }
    const maxD = Math.max(...tiles.map((t) => t.d));
    tiles.forEach((t) => tl.fromTo(t.el, { autoAlpha: 0, scale: 0.4, rotationY: 80 }, { autoAlpha: 1, scale: 1, rotationY: 0, duration: 0.45, ease: "power3.out" }, 3.75 + (t.d / maxD) * 1.2));
    // ---------- 拿去用：迷你卡沿直线落到每个 AI 小标，指示点转青 ----------
    tiles.forEach((t) => { const st = 5.45 + (t.d / maxD) * 0.9;
      const m = MU.el("div", "mini", fg, null, { left: (t.x + 26) + "px", top: (t.y - 26) + "px" });
      tl.fromTo(m, { autoAlpha: 0, y: -46, rotation: -12 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.32, ease: "power3.out" }, st);
      tl.to(t.el.querySelector("b"), { backgroundColor: "#66d4f2", scale: 1.25, duration: 0.2, ease: "power2.out" }, st + 0.22);
      tl.to(t.el.querySelector("i"), { borderColor: "#66d4f2", duration: 0.2 }, st + 0.22); });
    addSubs(tl, $("l5"));
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
